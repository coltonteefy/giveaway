[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'static site, no build step'"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/user.html"
  status = 200

[[redirects]]
  from = "/r/angie"
  to = "/user.html"
  status = 200

[[redirects]]
  from = "/b/*"
  to = "/user.html"
  status = 200

[[redirects]]
  from = "/organizer"
  to = "/organizer.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
